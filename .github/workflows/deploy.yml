name: CI/CD Auto Deploy to AZDIGI VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  deploy:
    name: Deploy to AZDIGI VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Connecting to VPS and triggering deploy script..."
            chmod +x /var/www/flower-shop/deploy.sh
            /var/www/flower-shop/deploy.sh

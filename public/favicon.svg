<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="25%" stop-color="#F7E5B5" />
      <stop offset="50%" stop-color="#C59B46" />
      <stop offset="75%" stop-color="#F9EDB8" />
      <stop offset="100%" stop-color="#9B7328" />
    </linearGradient>
    <linearGradient id="jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E654C" />
      <stop offset="50%" stop-color="#1B3B2B" />
      <stop offset="100%" stop-color="#0F241A" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F7E5B5" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#DFBA73" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#DFBA73" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base for contrast on dark/light tabs -->
  <circle cx="50" cy="50" r="48" fill="#1B3B2B" />
  
  <!-- Outer Gold Ring & Dots -->
  <circle cx="50" cy="50" r="44" stroke="url(#gold)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="41.5" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="1.5 2.5" />
  <path d="M50 3 L52 5 L50 7 L48 5 Z" fill="url(#gold)" />
  <path d="M50 93 L52 95 L50 97 L48 95 Z" fill="url(#gold)" />
  <path d="M3 50 L5 48 L7 50 L5 52 Z" fill="url(#gold)" />
  <path d="M93 50 L95 48 L97 50 L95 52 Z" fill="url(#gold)" />

  <!-- Diagonal Petals -->
  <path d="M50 50 C62 38 72 26 78 22 C74 28 62 38 50 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1" />
  <path d="M50 50 C38 38 28 26 22 22 C26 28 38 38 50 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1" />
  <path d="M50 50 C38 62 28 72 22 78 C26 72 38 62 50 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1" />
  <path d="M50 50 C62 62 72 72 78 78 C72 72 62 62 50 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1" />

  <!-- Major Blooming Petals -->
  <path d="M50 11 C41 24 43 38 50 48 C57 38 59 24 50 11 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M50 89 C41 76 43 62 50 52 C57 62 59 76 50 89 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M11 50 C24 41 38 43 48 50 C38 57 24 59 11 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1.2" />
  <path d="M89 50 C76 41 62 43 52 50 C62 57 76 59 89 50 Z" fill="url(#jade)" stroke="url(#gold)" stroke-width="1.2" />

  <!-- Center Jewel Facet & Star -->
  <circle cx="50" cy="50" r="14" fill="url(#glow)" />
  <polygon points="50,35 61,39 65,50 61,61 50,65 39,61 35,50 39,39" fill="#1B3B2B" stroke="url(#gold)" stroke-width="1" />
  <path d="M50 36 Q50 50 64 50 Q50 50 50 64 Q50 50 36 50 Q50 50 50 36 Z" fill="url(#gold)" />
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
</svg>
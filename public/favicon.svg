<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular soft cream base for visibility on all browser tab themes -->
  <circle cx="50" cy="50" r="48" fill="#FAF8F5" stroke="#E8EFEA" stroke-width="1.5" />
  
  <!-- 5-Petal Botanical Flower Emblem -->
  <g stroke="#1D3E2F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(0 50 50)"><ellipse cx="50" cy="24.5" rx="8" ry="18" fill="#FFFFFF"/></g>
    <g transform="rotate(72 50 50)"><ellipse cx="50" cy="24.5" rx="8" ry="18" fill="#FFFFFF"/></g>
    <g transform="rotate(144 50 50)"><ellipse cx="50" cy="24.5" rx="8" ry="18" fill="#FFFFFF"/></g>
    <g transform="rotate(216 50 50)"><ellipse cx="50" cy="24.5" rx="8" ry="18" fill="#FFFFFF"/></g>
    <g transform="rotate(288 50 50)"><ellipse cx="50" cy="24.5" rx="8" ry="18" fill="#FFFFFF"/></g>
    
    <!-- Central Coral/Salmon Pistil -->
    <circle cx="50" cy="50" r="6.2" fill="#D97769" stroke="#1D3E2F" stroke-width="3" />
  </g>
</svg>